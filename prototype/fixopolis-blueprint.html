<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixopolis Blueprint</title>
<style>
  :root{
    --ink:#1c1c1e; --bg:#f2f2f7; --card:#fff; --line:#e5e5ea; --grey:#8e8e93; --chev:#c4c4c7;
    --accent:#0F7C74; --accent-soft:#e3f2f0; --accent-ink:#08514c; --toggle:#34C759; --red:#D70015; --red-soft:#fdecee;
    --s-rec:#636366; --s-rec-bg:#ececf0; --s-asg:#0a5fc2; --s-asg-bg:#e6effb;
    --s-prog:#a35a00; --s-prog-bg:#fdf1e0; --s-fix:#1f7a3a; --s-fix-bg:#e4f4e9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:#dcdce2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
  button{font-family:inherit;color:inherit}
  #stage{position:relative}
  #phone{position:absolute;left:0;top:0;width:390px;height:800px;border:10px solid #1c1c1e;border-radius:58px;background:var(--bg);
         overflow:hidden;transform-origin:top left;box-shadow:0 20px 50px rgba(0,0,0,.25);font-size:16px}
  .under{display:flex;gap:10px;align-items:center}
  .under button{border:0;background:rgba(0,0,0,.08);color:#555;font-size:13px;padding:6px 14px;border-radius:14px;cursor:pointer}
  .under button:hover{background:rgba(0,0,0,.14)}

  /* status bar */
  .status{position:absolute;left:0;right:0;top:0;height:52px;z-index:10;pointer-events:none}
  .status .time{position:absolute;left:36px;top:17px;font-size:15px;font-weight:600}
  .status .island{position:absolute;left:50%;margin-left:-60px;top:11px;width:120px;height:32px;border-radius:16px;background:#111}
  .status .sig{position:absolute;right:76px;top:22px;display:flex;gap:2px;align-items:flex-end}
  .status .sig i{display:block;width:4px;background:#111;border-radius:1px}
  .status .wifi{position:absolute;right:50px;top:21px}
  .status .batt{position:absolute;right:20px;top:22px;width:25px;height:12px;border:1px solid #111;border-radius:4px}
  .status .batt::after{content:"";position:absolute;inset:1.5px;background:#111;border-radius:2px}
  .homebar{position:absolute;left:50%;margin-left:-70px;bottom:8px;width:140px;height:5px;border-radius:3px;background:#111;z-index:10;pointer-events:none}

  /* screens */
  #screens{position:absolute;inset:0}
  .screen{position:absolute;inset:0;background:var(--bg);transition:transform .3s ease;overflow:hidden}
  .screen.white{background:#fff}
  .nav{position:absolute;left:0;right:0;top:52px;height:46px;border-bottom:1px solid #d1d1d6;text-align:center;line-height:46px;font-size:17px;font-weight:600;background:rgba(242,242,247,.96);z-index:2;padding:0 90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav .back{position:absolute;left:8px;top:0;height:46px;display:flex;align-items:center;gap:4px;color:var(--accent);font-size:17px;font-weight:400;cursor:pointer;background:none;border:0;padding:0 6px}
  .body{position:absolute;left:0;right:0;top:98px;bottom:0;overflow-y:auto;padding:16px 18px 130px}
  .body.full{top:52px}
  .card{background:var(--card);border-radius:12px;overflow:hidden}
  .item{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;position:relative;font-size:17px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
  .item.static{cursor:default}
  .item + .item::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
  .item:active:not(.static){background:#ececf1}
  .grow{flex:1;min-width:0}
  .meta{color:var(--grey);font-size:15px}
  .chev{width:8px;height:14px;flex:none}
  .label{font-size:13px;color:#6d6d72;letter-spacing:.3px;text-transform:uppercase;margin:22px 0 8px 16px}
  .label.first{margin-top:4px}
  .sub{font-size:14px;color:var(--grey)}
  .muted{color:var(--grey)}
  .btn{position:absolute;left:20px;right:20px;bottom:40px;height:54px;border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;
       display:flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;z-index:3}
  .btn:active{filter:brightness(.9)}
  .btn.inline{position:static;width:100%;margin-top:18px}
  .btn.secondary{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
  .btn.danger{background:#fff;color:var(--red);border:1.5px solid #f3c5cb}
  .toggle{width:51px;height:31px;border-radius:16px;background:#d1d1d6;position:relative;flex:none;transition:background .2s;cursor:pointer}
  .toggle::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
  .toggle.on{background:var(--toggle)}
  .toggle.on::after{transform:translateX(20px)}
  .ico{display:inline-flex;align-items:center;justify-content:center;flex:none}
  .ico svg{display:block}
  .err{color:var(--red);font-size:14px;margin:8px 4px 0;display:flex;gap:6px;align-items:flex-start;font-weight:500}
  .err svg{flex:none;margin-top:1px}

  /* splash */
  .splash{position:absolute;inset:52px 0 0;display:flex;flex-direction:column;align-items:center}
  .splash img{width:210px;margin-top:150px}
  .spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite;margin-top:46px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .splash .start{position:static;width:300px;margin-top:40px}
  .testrow{position:absolute;left:24px;right:24px;bottom:34px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--grey)}
  .testrow .dl{border:0;background:none;color:var(--grey);text-decoration:underline;font-size:13px;cursor:pointer;margin-left:auto;padding:4px}

  /* login + pin */
  .welcome{text-align:center;margin-top:118px;font-size:28px;font-weight:700}
  .welcome-sub{text-align:center;color:var(--grey);margin-top:6px}
  .bios{display:flex;justify-content:center;gap:28px;margin-top:70px}
  .bio{width:118px;display:flex;flex-direction:column;align-items:center;gap:10px;border:0;background:none;cursor:pointer;font-size:15px}
  .bio .ring{width:96px;height:96px;border-radius:50%;background:#fff;border:1px solid #d1d1d6;display:flex;align-items:center;justify-content:center;transition:box-shadow .3s,transform .15s}
  .bio:active .ring{transform:scale(.96)}
  .bio.scan .ring{box-shadow:0 0 0 10px var(--accent-soft)}
  .pinbtn{margin:34px auto 0;width:max-content;border:1.5px solid var(--accent);background:#fff;color:var(--accent);border-radius:22px;padding:10px 22px;font-size:16px;display:flex;gap:8px;align-items:center;cursor:pointer}
  .ordiv{display:flex;align-items:center;gap:10px;color:var(--grey);font-size:13px;margin:64px 30px 14px}
  .ordiv::before,.ordiv::after{content:"";flex:1;height:1px;background:#d1d1d6}
  .offbtn{margin:0 30px;width:calc(100% - 60px);background:#fff;border:0;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-size:16px;text-align:left;cursor:pointer}
  .offbtn .sub{display:block;font-size:13px}
  .offintro{margin:0 4px 6px;font-size:15px}
  .offerr{background:var(--red-soft);border:1px solid #f3c5cb;color:#8a0010;border-radius:12px;padding:12px 14px;display:flex;gap:10px;font-size:14.5px;line-height:1.4}
  .flabel{display:block;font-size:13px;color:#6d6d72;text-transform:uppercase;letter-spacing:.3px;margin:20px 0 8px 4px}
  .finput{width:100%;height:52px;border:0;border-radius:12px;background:#fff;padding:0 16px;font:inherit;font-size:17px;outline:none}
  .finput:focus{box-shadow:inset 0 0 0 2px var(--accent)}
  .finput.bad{box-shadow:inset 0 0 0 2px var(--red)}
  .finput:disabled{opacity:.55}
  .btn:disabled{opacity:.5;cursor:default}
  .minispin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite;display:inline-block}
  .fine{font-size:13px;color:var(--grey);margin-top:16px;line-height:1.45;text-align:center}
  .dots{display:flex;justify-content:center;gap:18px;margin-top:120px}
  .dots i{width:15px;height:15px;border-radius:50%;border:1.5px solid #8e8e93}
  .dots i.f{background:#1c1c1e;border-color:#1c1c1e}
  .keys{margin:46px 44px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 22px}
  .key{height:64px;border-radius:50%;border:0;background:#fff;font-size:26px;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.08)}
  .key:active{background:#d9d9df}
  .key.blank{visibility:hidden}
  .key.del{background:none;box-shadow:none;font-size:18px;color:var(--accent)}

  /* home */
  .topbar{position:absolute;left:18px;right:18px;top:60px;display:flex;justify-content:space-between;align-items:center;z-index:2}
  .roundbtn{width:40px;height:40px;border-radius:50%;border:0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .avatar{background:var(--accent);color:#fff;font-weight:600;font-size:15px}
  .hometitle{position:absolute;left:24px;top:112px;margin:0;font-size:34px;font-weight:700}
  .homesub{position:absolute;left:25px;top:158px;color:var(--grey);font-size:15px;display:flex;gap:4px;align-items:center}
  .tiles{position:absolute;left:18px;right:18px;top:200px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tile{background:#fff;border:0;border-radius:18px;padding:18px 16px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .tile:active{background:#ececf1}
  .tile .badge-ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft)}
  .tile b{font-size:17px;font-weight:600;line-height:1.25}
  .tile.wide{grid-column:1 / -1;min-height:auto;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;padding:14px 16px}
  .tile.wide .badge-ico{width:44px;height:44px;background:#f0f0f3}

  /* report type */
  .bigopt{display:flex;align-items:center;gap:16px;width:100%;background:#fff;border:0;border-radius:16px;padding:18px 16px;margin-bottom:14px;cursor:pointer;text-align:left}
  .bigopt:active{background:#ececf1}
  .bigopt .badge-ico{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex:none}
  .bigopt b{display:block;font-size:18px;margin-bottom:3px}

  /* report form */
  .cam{height:190px;border-radius:14px;background:#e5e5ea;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#636366;font-size:15px;cursor:pointer;position:relative;overflow:hidden;border:0;width:100%}
  .cam.bad{box-shadow:inset 0 0 0 2px var(--red)}
  .cam svg.ph{position:absolute;inset:0;width:100%;height:100%}
  .chip-retake{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:14px;padding:6px 12px;font-size:14px;cursor:pointer;border:0;display:flex;gap:5px;align-items:center}
  .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .cat{background:#fff;border:1.5px solid transparent;border-radius:12px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;cursor:pointer;line-height:1.15;text-align:center}
  .cat.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .cats.bad .cat{border-color:#f3c5cb}
  .locrow{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:16px}
  .linkbtn{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--accent);font-size:16px;cursor:pointer;padding:12px 16px;width:100%;text-align:left}
  .card.bad{box-shadow:inset 0 0 0 2px var(--red)}
  .textarea{width:100%;height:96px;background:#fff;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-size:16px;resize:none;outline:none}
  .textarea.bad{box-shadow:inset 0 0 0 2px var(--red)}
  .textarea::placeholder{color:#b0b0b6}

  /* summary */
  .thumb{width:64px;height:64px;border-radius:10px;background:#e5e5ea;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
  .thumb svg.ph{width:100%;height:100%}
  .sumrow{display:flex;align-items:center;gap:14px;padding:12px 16px}
  .kv{display:flex;padding:12px 16px;gap:12px;font-size:16px;position:relative}
  .kv + .kv::before,.sumrow + .kv::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
  .kv .k{color:var(--grey);width:84px;flex:none}
  .kv .v{flex:1;min-width:0}

  /* badges, rows */
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:10px;padding:3px 8px;white-space:nowrap}
  .b-RECEIVED{color:var(--s-rec);background:var(--s-rec-bg)} .b-ASSIGNED{color:var(--s-asg);background:var(--s-asg-bg)}
  .b-IN_PROGRESS{color:var(--s-prog);background:var(--s-prog-bg)} .b-FIXED{color:var(--s-fix);background:var(--s-fix-bg)}
  .rowico{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex:none}
  .rtitle{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rsub{font-size:13px;color:var(--grey);margin-top:2px;display:flex;gap:8px;align-items:center}
  .bumps{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:600}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:#e3e3e8;border-radius:10px;padding:2px;margin-bottom:14px}
  .seg button{border:0;background:none;border-radius:8px;padding:8px 0;font-size:15px;cursor:pointer;color:#3a3a3c}
  .seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .map{border-radius:14px;position:relative;overflow:hidden;background:#e7ede3;aspect-ratio:336/200}
  .map svg{display:block;width:100%;height:100%}
  .map.pick{cursor:crosshair}
  .pin{cursor:pointer}
  .empty{padding:22px 16px;text-align:center;color:var(--grey);font-size:15px}

  /* details */
  .tl{position:relative;padding:12px 16px 12px 46px}
  .tl .dot{position:absolute;left:16px;top:15px;width:18px;height:18px;border-radius:50%;z-index:1;display:flex;align-items:center;justify-content:center}
  .tl:not(:last-child)::after{content:"";position:absolute;left:24px;top:33px;bottom:-15px;width:2px;background:#d1d1d6}
  .tl .t{font-size:16px;font-weight:600}
  .tl .n{font-size:14px;color:#3a3a3c;margin-top:2px}
  .bumpcard{padding:14px 16px}
  .bumpcount{font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px}
  .bumpbtn{margin-top:12px;width:100%;height:46px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
  .bumpbtn.done{background:var(--accent-soft);color:var(--accent-ink)}
  .undo{border:0;background:none;color:var(--accent);font-size:15px;cursor:pointer;margin-top:6px;padding:6px 0;width:100%;text-decoration:underline}

  /* confirm */
  .tick{width:96px;height:96px;margin:150px auto 0;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;animation:pop .35s ease}
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .ctext{text-align:center;padding:0 30px;margin-top:26px}
  .ctext h2{margin:0 0 8px;font-size:26px}
  .ctext p{margin:0;color:#6d6d72;font-size:16px;line-height:1.4}
  .ghost{position:absolute;left:20px;right:20px;bottom:104px;height:50px;border:0;background:none;color:var(--accent);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}

  /* help & profile */
  .helphead{display:flex;align-items:center;gap:14px;padding:14px 16px}
  .helphead img{width:64px}
  .help-p{padding:0 16px 14px;font-size:15px;line-height:1.45;color:#3a3a3c;margin:0}
  .howto{display:flex;gap:12px;padding:12px 16px;position:relative}
  .howto + .howto::before{content:"";position:absolute;left:66px;right:0;top:0;height:1px;background:var(--line)}
  .howto b{display:block;font-size:16px;margin-bottom:2px}
  .howto span{font-size:14px;color:#3a3a3c;line-height:1.4}
  .profilehead{display:flex;flex-direction:column;align-items:center;padding:10px 0 6px}
  .profilehead .avatar{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px}
  .profilehead h2{margin:12px 0 2px;font-size:22px}

  /* toast + dialog */
  #toast{position:absolute;left:24px;right:24px;bottom:110px;background:rgba(28,28,30,.92);color:#fff;border-radius:14px;padding:12px 16px;font-size:15px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
  #toast.show{opacity:1}
  #dialog{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none;align-items:center;justify-content:center}
  #dialog.show{display:flex}
  .alert{width:280px;background:rgba(250,250,252,.98);border-radius:16px;text-align:center;overflow:hidden}
  .alert h3{margin:18px 16px 4px;font-size:17px}
  .alert p{margin:0 16px 16px;font-size:14px;color:#3a3a3c}
  .alert .acts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #d1d1d6}
  .alert .acts button{border:0;background:none;height:46px;font-size:17px;cursor:pointer;color:var(--accent)}
  .alert .acts button + button{border-left:1px solid #d1d1d6;color:var(--red);font-weight:600}

  /* test mode (outside phone) */
  #pill{display:inline-flex;gap:6px;align-items:center;visibility:hidden;border:0;background:var(--accent);color:#fff;border-radius:16px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  #pill.show{visibility:visible}
  #overlay{position:fixed;inset:0;background:rgba(20,22,28,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  #overlay.show{display:flex}
  #overlay.sheet{background:rgba(20,22,28,.22)}
  #overlay.sheet.show{display:block}
  #overlay.sheet .modal{position:fixed;padding:16px 18px 14px;max-width:none;max-height:none;box-shadow:0 12px 36px rgba(0,0,0,.28)}
  #overlay.sheet h2{font-size:21px;margin:8px 0 6px}
  #overlay.sheet p{font-size:14px;margin:0 0 10px}
  #overlay.sheet .task{font-size:15px;padding:10px 12px;margin:6px 0 10px}
  #overlay.sheet .acts button{width:100%}
  .modal .pbar{display:flex;gap:6px;margin:8px 0 2px}
  .modal .pbar i{flex:1;height:5px;border-radius:3px;background:#e2e6ec}
  .modal .pbar i.on{background:var(--accent)}
  .modal .pbar i.skip{background:#b9c0ca}
  .modal{background:#fff;border-radius:20px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal .eyebrow{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
  .modal h2{margin:6px 0 10px;font-size:24px}
  .modal p{margin:0 0 12px;line-height:1.5;color:#3a3a3c}
  .modal .task{background:var(--accent-soft);border-radius:12px;padding:14px 16px;font-size:18px;line-height:1.45;color:var(--accent-ink);margin:6px 0 16px}
  .modal ol{padding-left:20px;margin:6px 0 16px;line-height:1.5}
  .modal ol li{margin-bottom:8px}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
  .modal .acts button{border:0;border-radius:12px;padding:12px 22px;font-size:16px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
  .modal .acts .ghbtn{border-radius:12px;padding:12px 22px;font-size:16px;font-weight:600;background:#1f2328;color:#fff;text-decoration:none;display:inline-flex;align-items:center}
  .modal .acts button.plain{background:#f0f0f3;color:#3a3a3c}
  .modal .warn{background:#fdf1e0;color:#6b3d00;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
  .sus{border-top:1px solid var(--line);padding:12px 0}
  .sus .q{font-size:15px;margin-bottom:8px}
  .sus .q b{color:var(--grey);font-weight:600;margin-right:6px}
  .sus .scale{display:grid;grid-template-columns:auto repeat(5,40px) auto;align-items:center;gap:6px;font-size:12px;color:var(--grey)}
  .sus .scale button{height:36px;border-radius:10px;border:1.5px solid #d1d1d6;background:#fff;font-size:15px;cursor:pointer}
  .sus .scale button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .sus.miss .scale button{border-color:#f3a4ae}
  .sus.miss .q{color:var(--red)}
  .modal textarea{width:100%;height:80px;border:1.5px solid #d1d1d6;border-radius:10px;padding:10px;font:inherit;font-size:15px;resize:vertical}

:root{--accent:#0F7C74;--accent-soft:#E2F2F0;--accent-ink:#0A4F4A;--bp:#0F3557;--bp-line:#9fc4e0;--paper:#F3F6F9;--pgrid:rgba(15,53,87,.07);--bgrid:rgba(255,255,255,.08);--amber:#F5B841;--ink:#0F2235;--grey:#5A6B7D;--toggle:#0F7C74}

.nav .back{color:#fff;height:50px;font-weight:500}
.body{top:102px}
.body.full{top:52px}
.label{font-weight:600;font-size:11px;letter-spacing:1.6px;color:var(--grey);display:flex;align-items:center;gap:8px;margin-left:2px}
.label::before{content:"";width:14px;height:1.5px;background:var(--accent);flex:none}

/* drawing-card language: square, outlined, registration corners */
.card{border-radius:0;border:1.5px solid var(--ink);overflow:visible;position:relative}
.card::before,.card::after{content:"";position:absolute;width:9px;height:9px;border:2px solid var(--accent);pointer-events:none}

.btn.secondary{border-radius:0}
.toggle.on{background:var(--accent)}
.sub{color:var(--grey)}

/* splash */
.bp-full{position:absolute;inset:0;background:linear-gradient(var(--bgrid) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--bgrid) 1px,transparent 1px) 0 0/22px 22px,var(--bp);color:#fff}
.bp-splash{position:absolute;inset:52px 0 0;display:flex;flex-direction:column;align-items:center}
.bp-splash img{width:220px;margin-top:150px}
.bp-full .spinner{border-color:rgba(255,255,255,.2);border-top-color:#fff}

/* login */

.bp-card::before,.bp-card::after{content:"";position:absolute;width:9px;height:9px;border:2px solid var(--accent)}
.bp-card::before{left:-6px;top:-6px;border-right:0;border-bottom:0}
.bp-card::after{right:-6px;bottom:-6px;border-left:0;border-top:0}
.bp-card:active{background:#eaf1f6}

.bp-wide{flex-direction:row;align-items:center;gap:14px}

.bp-pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bp-cap{display:block;font-size:10.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}

/* report type */
.bigopt{border-radius:0;border:1.5px solid var(--ink)}

.textarea{border-radius:0;border:1.5px dashed #9fb0c1}

.bp-bump::before{left:-6px;top:-6px;border-right:0;border-bottom:0}

class Location {
  constructor({street, suburb, mapX, mapY, source='gps', note=''}){ Object.assign(this, {street, suburb, mapX, mapY, source, note}); }
  get label(){ return this.note || `${this.street}, ${this.suburb}`; }
  get sourceLabel(){ return this.source === 'map' ? 'Chosen on map' : 'Current location'; }
}

class StatusUpdate {
  constructor({status, date, note=''}){ Object.assign(this, {status, date, note}); }
  get label(){ return STATUSES[this.status].label; }
}

class Report {
  constructor(d){
    this.id = d.id; this.authorId = d.authorId; this.category = d.category; this.title = d.title;
    this.details = d.details || ''; this.hasPhoto = !!d.hasPhoto; this.createdAt = d.createdAt;
    this.location = new Location(d.location);
    this.updates = d.updates.map(u => new StatusUpdate(u));   // oldest first
    this.bumpedBy = new Set(d.bumpedBy || []);
    this.getUpdates = d.getUpdates ?? true;
  }
  get categoryInfo(){ return CATEGORIES[this.category]; }
  get status(){ return this.updates[this.updates.length - 1].status; }
  get bumpCount(){ return this.bumpedBy.size; }
  isOwnedBy(user){ return !!user && this.authorId === user.id; }
  hasBumped(user){ return !!user && this.bumpedBy.has(user.id); }
  canBeBumpedBy(user){ return !!user && !this.isOwnedBy(user) && !this.hasBumped(user); }
}

/* ---------- 3. SERVICES ---------- */
class EventBus {
  constructor(){ this.handlers = {}; this.any = []; }
  on(type, fn){ (this.handlers[type] ||= []).push(fn); }
  onAny(fn){ this.any.push(fn); }
  emit(type, payload={}){
    const evt = {type, ...payload};
    (this.handlers[type] || []).forEach(fn => fn(evt));
    this.any.forEach(fn => fn(evt));
  }
}

class ReportStore {
  constructor(bus){ this.bus = bus; this.reports = []; this.seed = []; this.nextNum = 104; }
  load(seed){ this.seed = seed; this.reset(); }
  reset(){ this.reports = this.seed.map(d => new Report(JSON.parse(JSON.stringify(d)))); this.nextNum = 104; this.bus.emit('store:reset'); }
  byUser(user){ return this.sorted(this.reports.filter(r => r.isOwnedBy(user))); }
  notByUser(user){ return this.sorted(this.reports.filter(r => !r.isOwnedBy(user))); }
  sorted(list){ return list.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt)); }
  get(id){ return this.reports.find(r => r.id === id); }
  newId(){ return 'R-' + (this.nextNum++); }
  add(report){ this.reports.push(report); this.bus.emit('report:added', {report}); }
  remove(id){ const report = this.get(id); this.reports = this.reports.filter(r => r.id !== id); this.bus.emit('report:removed', {report}); }
  bump(id, user){ const r = this.get(id); if (!r || !r.canBeBumpedBy(user)) return false; r.bumpedBy.add(user.id); this.bus.emit('report:bumped', {report:r, user}); return true; }
  unbump(id, user){ const r = this.get(id); if (!r || !r.hasBumped(user)) return false; r.bumpedBy.delete(user.id); this.bus.emit('report:unbumped', {report:r, user}); return true; }
}

class ReportDraft {
  constructor(mode){ this.mode = mode; this.hasPhoto = false; this.category = null; this.useGps = true; this.manualLocation = null; this.details = ''; this.getUpdates = true; this.errors = {}; }
  get location(){ return this.useGps ? new Location(GPS_LOCATION) : this.manualLocation; }
  validate(){
    const e = {};
    if (this.mode === 'photo' && !this.hasPhoto) e.photo = 'Add a photo of the problem, or go back and choose Written report.';
    if (!this.category) e.category = 'Choose the category that best fits the problem.';
    if (!this.location) e.location = 'Location is off. Turn on current location or choose the spot on the map.';
    if (this.mode === 'written' && this.details.trim().length < 3) e.details = 'Describe the problem in a few words so the council knows what to fix.';
    this.errors = e; return e;
  }
  toReport(user, id){
    const cat = CATEGORIES[this.category];
    return new Report({id, authorId:user.id, category:this.category, title: cat.newTitle,
      details:this.details.trim(), hasPhoto:this.hasPhoto, createdAt:todayIso(), location:{...this.location},
      updates:[{status:'RECEIVED', date:todayIso(), note:'Sent to Elmwood Council'}], bumpedBy:[], getUpdates:this.getUpdates});
  }
}

class ConfirmDialog {
  constructor(el){ this.el = el; this.onOk = null; }
  open({title, text, ok}, onOk){
    this.onOk = onOk;
    this.el.innerHTML = `<div class="alert"><h3>${esc(title)}</h3><p>${esc(text)}</p>
      <div class="acts"><button data-act="dlgCancel">Cancel</button><button data-act="dlgOk">${esc(ok)}</button></div></div>`;
    this.el.classList.add('show');
  }
  close(){ this.el.classList.remove('show'); this.el.innerHTML = ''; }
  handle(act){ if (act === 'dlgCancel') { this.close(); return true; } if (act === 'dlgOk') { const f = this.onOk; this.close(); f && f(); return true; } return false; }
  get isOpen(){ return this.el.classList.contains('show'); }
}

class Screen {
  constructor(app, params={}){ this.app = app; this.params = params; this.el = null; }
  get title(){ return ''; }
  get showBack(){ return true; }
  get cls(){ return ''; }
  render(){ return ''; }                       // subclasses override
  html(){ const custom = this.app.theme.render(this); if (custom != null) return custom; return (this.title ? NavBar.render(this.title, this.showBack) : '') + this.render(); }
  mount(el){ this.el = el; }
  unmount(){}
  refresh(){ if (!this.el) return; const sc = $('.body', this.el)?.scrollTop || 0; this.el.innerHTML = this.html(); this.mount(this.el); const b = $('.body', this.el); if (b) b.scrollTop = sc; }
  handle(act, target){ if (act === 'back') return this.app.nav.back(); const fn = this['on_' + act]; if (fn) fn.call(this, target); }
  get user(){ return this.app.session.currentUser; }
}

class OfficialLoginScreen extends Screen {
  // Deliberately non-functional: council staff are out of scope for the test persona.
  constructor(app){ super(app); this.attempts = 5; this.checking = false; this.error = null; this.fieldErr = {}; this.staffId = ''; this.keepPw = ''; }
  get title(){ return 'Council official sign-in'; }
  get locked(){ return this.attempts <= 0; }
  render(){
    const fe = k => this.fieldErr[k] ? `<div class="err" role="alert">${icon('alert',16,'currentColor',2.2)}<span>${this.fieldErr[k]}</span></div>` : '';
    const banner = this.error
      ? `<div class="offerr" role="alert">${icon('alert',20,'#D70015',2.2)}<div>${this.error}</div></div>`
      : `<p class="sub offintro">For Elmwood Council staff. Residents can go back and sign in with Face ID, Touch ID or a PIN.</p>`;
    const dis = this.locked ? 'disabled' : '';
    return `<div class="body">${banner}
      <label class="flabel" for="staffId">Government staff ID</label>
      <input class="finput ${this.error || this.fieldErr.id ? 'bad' : ''}" id="staffId" autocomplete="off" placeholder="e.g. EC-204817" value="${esc(this.staffId)}" ${dis}>${fe('id')}
      <label class="flabel" for="staffPw">Password</label>
      <input class="finput ${this.error || this.fieldErr.pw ? 'bad' : ''}" id="staffPw" type="password" autocomplete="off" placeholder="Password" value="${esc(this.keepPw)}" ${dis}>${fe('pw')}
      <button class="btn inline" data-act="signin" ${dis || (this.checking ? 'disabled' : '')}>${this.checking ? '<span class="minispin"></span>Checking…' : 'Sign in'}</button>
      <p class="fine">For Elmwood Council staff only.<br>Forgotten your password? Contact the council IT service desk.</p></div>`;
  }
  mount(el){ super.mount(el); const id = $('#staffId', el); id.addEventListener('input', () => { this.staffId = id.value; }); }
  on_signin(){
    if (this.checking || this.locked) return;
    const id = $('#staffId', this.el).value.trim(), pw = $('#staffPw', this.el).value;
    this.staffId = id; this.fieldErr = {}; this.keepPw = '';
    if (!id) this.fieldErr.id = 'Enter your staff ID.';
    if (!pw) this.fieldErr.pw = 'Enter your password.';
    if (Object.keys(this.fieldErr).length) { this.keepPw = pw; this.error = null; this.refresh(); return; }
    this.checking = true; this.error = null; this.refresh();
    setTimeout(() => {
      this.checking = false; this.attempts--;
      this.error = this.attempts > 0
        ? `<b>We couldn't sign you in.</b><br>The staff ID or password is incorrect. Check your details and try again. You have ${this.attempts} attempt${this.attempts === 1 ? '' : 's'} left before your account is locked for 15 minutes.`
        : `<b>Too many attempts.</b><br>Your account is locked for 15 minutes. Contact the council IT service desk if you need help.`;
      this.refresh();
    }, 1100);

/* ---------- Navigator ---------- */
class Navigator {
  constructor(app, host){ this.app = app; this.host = host; this.stack = []; this.curEl = null; }
  get current(){ return this.stack[this.stack.length - 1]; }
  push(screen){ this.stack.push(screen); this.show(screen, 'fwd'); }
  back(){ if (this.stack.length < 2) return; const old = this.stack.pop(); old.unmount(); this.show(this.current, 'back'); }
  reset(screen, silent=false){ this.stack.forEach(s => s.unmount()); this.stack = [screen]; if (!silent) this.show(screen, 'fwd'); }
  show(screen, dir){
    const el = document.createElement('div');
    el.className = 'screen ' + screen.cls;
    el.innerHTML = screen.html();
    const old = this.curEl;
    if (!old) this.host.appendChild(el);
    else {
      el.style.transform = dir === 'back' ? 'translateX(-30%)' : 'translateX(100%)';
      this.host.appendChild(el); void el.offsetWidth;
      el.style.transform = 'translateX(0)';
      old.style.transform = dir === 'back' ? 'translateX(100%)' : 'translateX(-30%)';
      old.style.pointerEvents = 'none';
      setTimeout(() => old.remove(), 320);
    }
    this.curEl = el;
    screen.mount(el);
    this.app.bus.emit('screen:shown', {screen});
  }
  clear(){ this.stack.forEach(s => s.unmount()); this.stack = []; this.host.innerHTML = ''; this.curEl = null; }
}

/* ---------- 6. TEST MODE ---------- */
class TaskResult {
  constructor(task, participantId, runStarted){ Object.assign(this, {task, participantId, runStarted}); this.startedAt = performance.now(); this.taps = 0; this.deadTaps = 0; this.backs = 0; this.completed = false; this.skipped = false; }
  finish(completed, skipped){ this.endedAt = performance.now(); this.completed = completed; this.skipped = skipped; }
  get seconds(){ return ((this.endedAt ?? performance.now()) - this.startedAt) / 1000; }
  toRow(){ return {participant_id:this.participantId, run_started:this.runStarted, task:this.task.id, completed:this.completed ? 1 : 0, skipped:this.skipped ? 1 : 0,
    time_s:this.seconds.toFixed(1), taps:this.taps, dead_taps:this.deadTaps, backs:this.backs, min_taps:this.task.minTaps,
    efficiency: this.taps ? Math.min(1, this.task.minTaps / this.taps).toFixed(2) : ''}; }
}

class InteractionLogger {
  constructor(){ this.active = null; }
  attach(phoneEl){ phoneEl.addEventListener('click', e => this.onClick(e), true); }
  begin(task, pid, runStarted){ this.active = new TaskResult(task, pid, runStarted); return this.active; }
  onClick(e){
    const r = this.active; if (!r) return;
    const hit = e.target.closest('[data-act], input, textarea, select');
    if (hit) { r.taps++; if (hit.dataset.act === 'back') r.backs++; } else r.deadTaps++;
  }
  end(completed, skipped){ const r = this.active; if (!r) return null; r.finish(completed, skipped); this.active = null; return r; }
}

class PostTestSurvey {
  constructor(pid){ this.pid = pid; this.answers = Array(SUS_ITEMS.length).fill(null); this.comment = ''; }
  set(i, v){ this.answers[i] = v; }
  missing(){ return this.answers.map((a, i) => a == null ? i : -1).filter(i => i >= 0); }
  susScore(){ return this.answers.reduce((s, v, i) => s + (i % 2 === 0 ? v - 1 : 5 - v), 0) * 2.5; }
  toRow(){ const row = {participant_id:this.pid, submitted_at:new Date().toISOString()}; this.answers.forEach((v, i) => row['sus_q' + (i + 1)] = v); row.sus_score = this.susScore(); row.comment = this.comment.trim(); return row; }
}

/* CSV writers: one interface, two implementations */
const csvCell = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
class ResultsWriter {
  static HEADERS = {
    tasks: ['participant_id','run_started','task','completed','skipped','time_s','taps','dead_taps','backs','min_taps','efficiency'],
    survey:['participant_id','submitted_at', ...SUS_ITEMS.map((_, i) => 'sus_q' + (i + 1)),'sus_score','comment'],
  };
  static FILES = {tasks:'results_tasks.csv', survey:'results_survey.csv'};
  static line(kind, row){ return ResultsWriter.HEADERS[kind].map(h => csvCell(row[h])).join(',') + '\n'; }
  static maxId(text){ let m = 0; for (const x of String(text).matchAll(/^P(\d+),/gm)) m = Math.max(m, +x[1]); return m; }
  async append(kind, row){ throw new Error('not implemented'); }
  async maxParticipant(){ return 0; }
}

class BrowserCsvWriter extends ResultsWriter {
  constructor(){ super(); this.key = 'fixopolis_results_v1'; this.mem = {tasks:'', survey:''}; }
  read(){ try { const v = JSON.parse(localStorage.getItem(this.key)); if (v) return v; } catch(e) {} return this.mem; }
  write(v){ this.mem = v; try { localStorage.setItem(this.key, JSON.stringify(v)); } catch(e) {} }
  async append(kind, row){ const v = this.read(); v[kind] = (v[kind] || '') + ResultsWriter.line(kind, row); this.write(v); }
  async maxParticipant(){ const v = this.read(); return Math.max(ResultsWriter.maxId(v.tasks), ResultsWriter.maxId(v.survey)); }
  download(){ const v = this.read(); let n = 0;
    for (const kind of ['tasks','survey']) { if (!v[kind]) continue; n++;
      const blob = new Blob([ResultsWriter.HEADERS[kind].join(',') + '\n' + v[kind]], {type:'text/csv'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = ResultsWriter.FILES[kind]; document.body.appendChild(a); a.click(); a.remove(); }
    return n; }
}

const IDB = {
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('fixopolis-proto', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ try { const db = await this.open(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch(e) { return undefined; } },
  async set(k, v){ try { const db = await this.open(); await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch(e) {} },
};

class FileCsvWriter extends ResultsWriter {
  static supported(){ return 'showDirectoryPicker' in window && window.top === window; }
  constructor(){ super(); this.dir = null; }
  async connect(){                        // must run from a click
    let h = await IDB.get('resultsDir');
    if (h) { try { const p = await h.queryPermission({mode:'readwrite'}); if (p !== 'granted' && (await h.requestPermission({mode:'readwrite'})) !== 'granted') h = null; } catch(e) { h = null; } }
    if (!h) { h = await window.showDirectoryPicker({id:'fixopolis-results', mode:'readwrite'}); await IDB.set('resultsDir', h); }
    this.dir = h; return h.name;
  }
  async readText(name){ try { const fh = await this.dir.getFileHandle(name); return await (await fh.getFile()).text(); } catch(e) { return ''; } }
  async append(kind, row){
    const fh = await this.dir.getFileHandle(ResultsWriter.FILES[kind], {create:true});
    const size = (await fh.getFile()).size;
    const w = await fh.createWritable({keepExistingData:true});
    await w.seek(size);
    await w.write((size === 0 ? ResultsWriter.HEADERS[kind].join(',') + '\n' : '') + ResultsWriter.line(kind, row));
    await w.close();
  }
  async maxParticipant(){ return Math.max(ResultsWriter.maxId(await this.readText(ResultsWriter.FILES.tasks)), ResultsWriter.maxId(await this.readText(ResultsWriter.FILES.survey))); }
}

class ResultsService {
  constructor(){ this.backup = new BrowserCsvWriter(); this.file = FileCsvWriter.supported() ? new FileCsvWriter() : null; this.fileReady = false; this.folderName = ''; this.lastError = null; }
  async prepare(){
    this.fileReady = false;
    if (this.file) { try { this.folderName = await this.file.connect(); this.fileReady = true; } catch(e) { this.lastError = e; } }
    const ids = [await this.backup.maxParticipant()];
    if (this.fileReady) ids.push(await this.file.maxParticipant());
    return Math.max(0, ...ids) + 1;
  }
  async append(kind, row){
    await this.backup.append(kind, row);
    if (!this.fileReady) return false;
    try { await this.file.append(kind, row); return true; } catch(e) { this.lastError = e; return false; }
  }
  downloadBackup(){ return this.backup.download(); }
}

class TestOverlay {

    this.el.classList.toggle('sheet', !!opts.sheet); this.el.classList.add('show');

class TestController {
  constructor(app){ this.app = app; this.state = 'IDLE'; this.pill = $('#pill'); this.pill.addEventListener('click', () => this.showReminder()); }
  get active(){ return this.state !== 'IDLE'; }
  get task(){ return TASKS[this.taskIndex]; }
  async start(){
    const a = this.app; this.state = 'STARTING'; a.nav.current.refresh && a.nav.current.refresh();
    const id = await a.results.prepare();
    this.pid = 'P' + id; this.runStarted = new Date().toISOString(); this.taskIndex = 0; this.outcomes = []; this.taskRows = []; this.surveyRow = null;
    a.store.reset(); a.session.signIn('Face ID'); a.draft = null;
    this.state = 'INTRO';
    const warn = a.results.fileReady ? '' : `<div class="warn">No results folder connected, so results are kept in this browser only. Use “Download results” on the start screen afterwards.</div>`;
    a.overlay.show(`<div class="eyebrow">Usability test · Participant ${this.pid}</div>
      <h2>Thanks for taking part</h2>
      <p>You'll try 3 short tasks in the Fixopolis app. There are no right or wrong answers: we're testing the app, not you. Please think aloud as you go.</p>
      <ol>${TASKS.map(t => `<li>${esc(t.prompt)}</li>`).join('')}</ol>
      <p>We'll show each task again before you start it. Afterwards there's a short questionnaire.</p>${warn}
      <div class="acts"><button data-tact="cancel" class="plain">Cancel</button><button data-tact="go">Start</button></div>`,
      {go: () => this.showTask(), cancel: () => this.finish(true)});
  }
  showTask(){
    const a = this.app, n = this.taskIndex + 1; this.state = 'PROMPT';
    a.overlay.show(`<div class="eyebrow">Task ${n} of ${TASKS.length}</div><h2>${n === 1 ? 'Your first task' : 'Next task'}</h2>
      <div class="task">${esc(this.task.prompt)}</div><p>Tap Begin when you're ready. You'll start on the sign-in screen.</p>
      <div class="acts"><button data-tact="begin">Begin</button></div>`, {begin: () => this.beginTask()});
  }
  beginTask(){
    const a = this.app; a.overlay.hide(); a.dialog.close();
    if (this.taskIndex === 0) { a.draft = null; a.session.signOut(); a.nav.reset(new LoginScreen(a)); }   // Task 1 starts at sign-in; later tasks carry on from the current screen
    a.logger.begin(this.task, this.pid, this.runStarted);
    this.state = 'TASK';
    this.pill.innerHTML = `${icon('info',16,'#fff',2.2)}Task ${this.taskIndex + 1} of ${TASKS.length}`; this.pill.classList.add('show');
  }
  onEvent(evt){ if (this.state !== 'TASK') return; const r = this.task.check(evt); if (r) this.endTask(r.completed, false); }
  showReminder(){
    if (this.state !== 'TASK') return;
    this.app.overlay.show(`<div class="eyebrow">Task ${this.taskIndex + 1} of ${TASKS.length}</div><h2>Your task</h2><div class="task">${esc(this.task.prompt)}</div>
      <p>Stuck? It's fine to skip. That tells us something too.</p>
      <div class="acts"><button data-tact="skip" class="plain">Skip task</button><button data-tact="back">Continue task</button></div>`,
      {back: () => this.app.overlay.hide(), skip: () => this.endTask(false, true)});
  }
  async endTask(completed, skipped){
    const a = this.app; this.state = 'SAVING'; this.pill.classList.remove('show');
    const res = a.logger.end(completed, skipped);
    const row = res.toRow(); this.taskRows.push(row);
    const ok = await a.results.append('tasks', row);
    if (!ok && a.results.fileReady) a.toast.show('Could not write to the results file (is it open in Excel?). Saved in browser backup.');
    this.outcomes.push(skipped ? 'skipped' : 'done');
    this.taskIndex++;
    setTimeout(() => this.showProgress(skipped), skipped ? 0 : 900);
  }
  showProgress(skipped){
    const a = this.app, done = this.taskIndex, last = done >= TASKS.length; this.state = last ? 'SURVEY_NEXT' : 'PROMPT';
    const bar = TASKS.map((t, i) => `<i class="${i < done ? (this.outcomes[i] === 'skipped' ? 'skip' : 'on') : ''}"></i>`).join('');
    const title = last ? 'All tasks done' : `Task ${done} ${skipped ? 'skipped' : 'complete'}`;
    const body = last
      ? `<p>Nice work. Last of all, a short questionnaire about the app.</p>`
      : `<div class="eyebrow">Next · Task ${done + 1} of ${TASKS.length}</div><div class="task">${esc(TASKS[done].prompt)}</div><p class="sub">Carry on from this screen when you're ready.</p>`;
    a.overlay.show(`<div class="eyebrow">Progress · Participant ${this.pid}</div><div class="pbar">${bar}</div><h2>${title}</h2>${body}
      <div class="acts"><button data-tact="go">${last ? 'Continue to questionnaire' : 'Continue'}</button></div>`,
      {go: () => last ? this.showSurvey() : this.beginTask()}, {sheet:true});
  }
  showSurvey(){
    const a = this.app; this.state = 'SURVEY'; this.survey = new PostTestSurvey(this.pid);
    const render = (showMissing) => {
      const miss = new Set(showMissing ? this.survey.missing() : []);
      a.overlay.show(`<div class="eyebrow">All 3 tasks done · Participant ${this.pid}</div><h2>A few questions about the app</h2>
        <p>Rate how much you agree with each statement: 1 = strongly disagree, 5 = strongly agree.</p>
        ${SUS_ITEMS.map((q, i) => `<div class="sus ${miss.has(i) ? 'miss' : ''}"><div class="q"><b>${i + 1}</b>${esc(q)}</div>
          <div class="scale"><span>Disagree</span>${[1,2,3,4,5].map(v => `<button data-tact="ans" data-i="${i}" data-v="${v}" class="${this.survey.answers[i] === v ? 'on' : ''}">${v}</button>`).join('')}<span>Agree</span></div></div>`).join('')}
        <div class="sus"><div class="q">Anything confusing or missing? (optional)</div><textarea id="susComment">${esc(this.survey.comment)}</textarea></div>
        ${miss.size ? `<div class="err" role="alert">${icon('alert',16,'currentColor',2.2)}<span>Please answer every statement (${miss.size} left, marked in red).</span></div>` : ''}
        <div class="acts"><button data-tact="submit">Submit</button></div>`,
        {ans: (b) => { this.survey.comment = $('#susComment').value; this.survey.set(+b.dataset.i, +b.dataset.v); const row = b.closest('.sus'); row.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); row.classList.remove('miss'); },
         submit: async () => { this.survey.comment = $('#susComment').value;
           if (this.survey.missing().length) { const st = a.overlay.el.querySelector('.modal').scrollTop; render(true); a.overlay.el.querySelector('.modal').scrollTop = st; return; }
           this.surveyRow = this.survey.toRow();
           const ok = await a.results.append('survey', this.surveyRow);
           this.showThanks(ok); }});
    };
    render(false);
  }
  showThanks(ok){
    const a = this.app; this.state = 'DONE';
    a.overlay.show(`<div class="eyebrow">Finished</div><h2>Thank you!</h2><p>That's everything. Your answers have been saved as participant <b>${this.pid}</b>.</p>
      ${ok ? `<p class="sub">Saved to ${esc(ResultsWriter.FILES.tasks)} and ${esc(ResultsWriter.FILES.survey)} in “${esc(a.results.folderName)}”.</p>` : `<div class="warn">Saved in this browser only. Use “Download results” on the start screen to get the CSV files.</div>`}
      <p class="sub">To add these results to the team's GitHub, press <b>Send results to GitHub</b>, then <b>Submit new issue</b> on the page that opens (you need to be signed in to GitHub).</p>
      <div class="acts"><button data-tact="done" class="plain">Done</button><a class="ghbtn" href="${esc(this.githubIssueUrl())}" target="_blank" rel="noopener">Send results to GitHub</a></div>`, {done: () => this.finish()});
  }
  /* Builds a "new issue" link with this participant's results filled in */
  githubIssueUrl(){
    const a = this.app, rows = this.taskRows, sv = this.surveyRow;
    const yn = v => (+v ? 'yes' : 'no');
    const tH = ResultsWriter.HEADERS.tasks, sH = ResultsWriter.HEADERS.survey;
    const csvT = [tH.join(','), ...rows.map(r => ResultsWriter.line('tasks', r).trim())].join('\n');
    const csvS = sv ? [sH.join(','), ResultsWriter.line('survey', sv).trim()].join('\n') : '';
    const body = [
      `## Usability test results: ${this.pid}`, '',
      `**Prototype:** Fixopolis (${a.theme.name})  `, `**Run started:** ${this.runStarted}`, '',
      '### Tasks', '',
      '| Task | Completed | Skipped | Time (s) | Taps | Wrong taps | Back | Min taps | Efficiency |', '|---|---|---|---|---|---|---|---|---|',
      ...rows.map(r => `| ${r.task} | ${yn(r.completed)} | ${yn(r.skipped)} | ${r.time_s} | ${r.taps} | ${r.dead_taps} | ${r.backs} | ${r.min_taps} | ${r.efficiency || '-'} |`), '',
      '### Questionnaire (SUS)', '',
      sv ? `**SUS score:** ${sv.sus_score} / 100` : '_Not completed_', '',
      ...(sv ? ['| ' + SUS_ITEMS.map((_, i) => 'Q' + (i + 1)).join(' | ') + ' |', '|' + SUS_ITEMS.map(() => '---|').join(''), '| ' + SUS_ITEMS.map((_, i) => sv['sus_q' + (i + 1)]).join(' | ') + ' |', '',
               `**Comment:** ${sv.comment ? sv.comment.replace(/\n/g, ' ') : '_none_'}`, ''] : []),
      '<details><summary>CSV rows (for combining results)</summary>', '',
      '```csv', '# results_tasks.csv', csvT, ...(csvS ? ['', '# results_survey.csv', csvS] : []), '```', '</details>'
    ].join('\n');
    const title = `[Test results] ${this.pid}, ${new Date(this.runStarted).toLocaleString('en-AU', {dateStyle:'medium', timeStyle:'short'})}`;
    return `https://github.com/${RESULTS_REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
  }
  finish(){
    const a = this.app; a.logger.end(false, false); this.state = 'IDLE'; this.pill.classList.remove('show'); a.overlay.hide();
    a.store.reset(); a.session.signOut(); a.draft = null; a.nav.clear(); a.nav.push(new SplashScreen(a));
  }
}

  init(){
    this.store.load(SEED);

    this.logger.attach(phone);
    phone.addEventListener('click', e => {
      this.lastClick = e;
      const el = e.target.closest('[data-act]'); if (!el) return;

    });
    this.bus.onAny(evt => this.test.onEvent(evt));
    $('#restart').addEventListener('click', () => this.restart());
    addEventListener('resize', () => this.fit()); this.fit();
    this.theme.install(this);
    this.nav.push(new SplashScreen(this));
  }
  signedIn(method){ this.session.signIn(method); this.nav.reset(new HomeScreen(this)); this.toast.show(`Signed in with ${method}`); }
  restart(){ if (this.test.active) this.test.finish(); else { this.store.reset(); this.session.signOut(); this.session.staySignedIn = false; this.draft = null; this.dialog.close(); this.nav.clear(); this.nav.push(new SplashScreen(this)); } }
  fit(){
    const stage = $('#stage'), phone = $('#phone');
    const k = Math.min(1, (innerHeight - 110) / 800, (innerWidth - 40) / 390);
    phone.style.transform = `scale(${k})`; stage.style.width = 390 * k + 'px'; stage.style.height = 800 * k + 'px';
  }
}

      ? `<div class="bp-bump"><div class="grow"><b class="big">${r.bumpCount}</b> ${r.bumpCount === 1 ? 'neighbour has' : 'neighbours have'} bumped your report</div></div>`
      : `<div class="bp-bump"><div class="grow"><b class="big">${r.bumpCount}</b> ${r.bumpCount === 1 ? 'person' : 'people'} affected<span class="bp-cap">${bumped ? 'You bumped this report' : 'Bump it if it affects you too'}</span></div>
          ${bumped ? `<button class="bp-bumpbtn done" data-act="noop">${icon('check',18,'currentColor',2.6)}Bumped</button>` : `<button class="bp-bumpbtn" data-act="bump">${icon('bump',18,'#fff',2.4)}Bump</button>`}</div>
         ${bumped ? `<button class="undo" data-act="unbump">Undo bump</button>` : ''}`;
    return `<div class="body full bp-det">
      <div class="bp-dethead">
        <div class="bp-detbar"><button class="bp-ob bp-small" data-act="back" aria-label="Back">${icon('back',18,'#fff',2)}</button><span class="bp-ref">REPORT ${esc(r.id)} · REV ${this.rev(r.updates.length)}</span></div>
        <h1>${esc(r.title)}</h1>
        <div class="bp-refline">${esc(r.location.street.toUpperCase())}, ${esc(r.location.suburb.toUpperCase())} · GRID ${this.gridRef(r.location)} · ${fmtDate(r.createdAt).toUpperCase()}</div>
        <span class="bp-status" style="--sc:${STATUSES[r.status].color}">Status: ${STATUSES[r.status].label}</span>
      </div>
      <div class="bp-pad">
        <div class="bp-sum"><div class="bp-photo">${r.hasPhoto ? photoFor(r) : icon('pencil',26,'#8a99a8')}</div>
          <div class="grow"><div class="bp-catline">${icon(r.categoryInfo.icon,18,'var(--accent)',1.8)}${r.categoryInfo.label}</div><div class="bp-dtext">${r.details ? esc(r.details) : '<span class="muted">No details added</span>'}</div>${own ? '<div class="bp-cap">Reported by you</div>' : ''}</div></div>
        ${bump}
        <div class="label">Revision history</div>
        <table class="bp-rev"><thead><tr><th>Rev</th><th>Date</th><th>Change</th></tr></thead><tbody>${revs.map(v => `<tr><td>${v.rev}</td><td>${v.date}</td><td>${v.text}</td></tr>`).join('')}</tbody></table>
        ${own ? `<button class="btn inline danger" data-act="delete">${icon('trash',20)}Delete report</button>` : ''}
      </div></div>`;
  }
}
window.THEME_CLASS = BlueprintTheme;

const app = new App();
app.init();
</script>
</body>
</html>
